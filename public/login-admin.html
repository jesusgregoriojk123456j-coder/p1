<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGELAB - Acceso Administrador</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/config.js"></script>
</head>
<body>

    <header>
        <h1><i>🔐</i> Acceso Administrador</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="bitacora.html">Bitácora</a>
            <a href="inventario.html">Inventario</a>
        </nav>
    </header>

    <main style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
        <div class="contenedor" style="max-width: 400px; width: 100%;">
            <h2 style="text-align: center;">Panel Administrativo</h2>
            
            <form id="login-admin-form">
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="admin" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div style="text-align: center;">
                    <button type="submit" class="btn-exito">Ingresar al Panel</button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 10px;">
                <p><strong>Nota:</strong> Este acceso es exclusivo para administradores. Si no tienes credenciales, por favor contacta al soporte técnico.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 SIGELAB - Acceso restringido</p>
    </footer>

    <script>
    // Configuración de la API
    window.API_URL = '/api';

    // Función para peticiones a la API
    async function fetchAPI(endpoint, options = {}) {
        const token = localStorage.getItem('token');
        const headers = {
            'Content-Type': 'application/json',
            ...options.headers
        };
        
        if (token) {
            headers['Authorization'] = token;
        }
        
        const response = await fetch(`${window.API_URL}${endpoint}`, {
            ...options,
            headers
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Error en la petición');
        }
        
        return response.json();
    }

    // Login
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('login-admin-form');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const usuario = document.getElementById('usuario').value;
                const password = document.getElementById('password').value;
                
                try {
                    const response = await fetch(`${window.API_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: usuario, password: password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('usuario', JSON.stringify(data.usuario));
                        alert('✅ Acceso concedido');
                        window.location.href = 'admin-panel.html';
                    } else {
                        alert('❌ Credenciales incorrectas');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('❌ Error de conexión con el servidor');
                }
            });
        }
    });
    </script>
</body>
</html>
